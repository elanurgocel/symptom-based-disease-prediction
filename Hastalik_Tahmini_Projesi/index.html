<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sağlık Sistemi Portalı</title>
    <style>
        :root {
            --primary: #2ecc71;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .portal-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            border-top: 8px solid var(--primary);
        }
        .logo { font-size: 50px; margin-bottom: 10px; }
        h1 { color: var(--dark); font-size: 24px; margin-bottom: 15px; }
        p { color: #7f8c8d; line-height: 1.6; margin-bottom: 25px; }
        .launch-btn {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .launch-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
            background: #27ae60;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="logo">🧬</div>
        <h1>Hastalık Teşhis Portalı</h1>
        <p>Makine öğrenmesi tabanlı Random Forest modelini kullanarak semptom analizi yapmak için uygulamayı başlatın.</p>
        
        <!-- Streamlit varsayılan portuna yönlendirme -->
        <a href="http://localhost:8501" target="_blank" class="launch-btn">Sisteme Giriş Yap</a>
        
        <div class="footer">
            KTO Karatay Üniversitesi - Bilgisayar Mühendisliği<br>
            Ela Nur Göçel tarafından geliştirilmiştir.
        </div>
    </div>
</body>
</html>
